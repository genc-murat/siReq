<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="bg-flow-editor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#06071a"/>
    </linearGradient>
    <linearGradient id="accent-flow-editor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a97aff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#bg-flow-editor)" rx="12"/>
  <rect x="40" y="40" width="920" height="520" fill="none" stroke="#8b5cf622" stroke-width="2" rx="8" stroke-dasharray="8,6"/>
  <circle cx="500" cy="220" r="60" fill="url(#accent-flow-editor)" opacity="0.15"/>
  <circle cx="500" cy="220" r="40" fill="url(#accent-flow-editor)" opacity="0.25"/>
  <g transform="translate(500,220)">
    <rect x="-20" y="-12" width="40" height="24" rx="4" fill="url(#accent-flow-editor)" opacity="0.9"/>
    <polygon points="-6,-8 -6,8 6,0" fill="white"/>
  </g>
  <text x="500" y="310" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" opacity="0.9">Visual Flow Editor</text>
  <text x="500" y="345" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15">Connected Start, Request, Wait, Condition &amp; Logger nodes with Bezier wires</text>
  <text x="500" y="390" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Placeholder — replace with actual screenshot</text>
  <g transform="translate(230, 440)">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#8b5cf633"/>
    <text x="60" y="21" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">1000 x 600</text>
  </g>
  <g transform="translate(650, 440)">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#ffffff0d"/>
    <text x="60" y="21" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">flow-editor.png</text>
  </g>
