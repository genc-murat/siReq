[package]
name = "siReq"
version = "0.1.0"
description = "Postman-like HTTP client"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
nom = "7"
base64 = "0.22"
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
rquickjs = { version = "0.7", features = ["parallel"] }
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
sha2 = "0.10"
