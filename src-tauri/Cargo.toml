[package]
name = "siReq"
version = "0.5.6"
description = "Postman-like HTTP client"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "stream", "http2"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
nom = "7"
base64 = "0.22"
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }
futures-util = "0.3"
rquickjs = { version = "0.7", features = ["parallel"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.12"
prost-reflect = { version = "0.12", features = ["serde"] }
protox = { version = "0.6" }
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
sha2 = "0.10"
axum = { version = "0.7", features = ["tokio"] }
rand_distr = "0.4"
jsonpath-rust = "0.3"
regex = "1"

