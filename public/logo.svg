<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    
    <!-- Primary Gradients -->
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="gradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />

  <!-- Main Logo Mark -->
  <g filter="url(#shadow)">
    <!-- Outer Ring (Broken/Tech-style) -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gradCyan)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="40 180 80 40" transform="rotate(-45 256 256)" />
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gradPurple)" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="100 60 40 120" transform="rotate(120 256 256)" />

    <!-- Stylized S / Request Loop -->
    <!-- Cyan upper loop representing "Request" (outgoing) -->
    <path d="M 180 220 C 180 150, 332 150, 332 220 C 332 260, 290 280, 256 300 C 210 327, 180 340, 180 400" fill="none" stroke="url(#gradCyan)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" />
          
    <!-- Purple lower loop representing "Response" (incoming) -->
    <path d="M 332 292 C 332 362, 180 362, 180 292 C 180 252, 222 232, 256 212 C 302 185, 332 172, 332 112" fill="none" stroke="url(#gradPurple)" stroke-width="32" stroke-linecap="round" filter="url(#glow)" stroke-linejoin="round" />

    <!-- Dynamic overlapping connectors/arrowheads -->
    <!-- Cyan arrow head on top right loop to show outgoing flow -->
    <path d="M 320 240 L 348 215 L 348 255 Z" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Purple arrow head on bottom left loop to show incoming flow -->
    <path d="M 192 272 L 164 297 L 164 257 Z" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Central Connection Core (glowing data pulse) -->
    <circle cx="256" cy="256" r="16" fill="url(#gradWhite)" filter="url(#glow)" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>
</svg>
